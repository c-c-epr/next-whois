name: Docker Image CI

on:
  push:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/dependabot.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml

  build-amd64:
    name: Build image (linux/amd64)
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare image name
        id: image
        shell: bash
        run: echo "name=${REGISTRY}/${IMAGE_NAME,,}" >> "${GITHUB_OUTPUT}"

      - name: Read Node.js version
        id: node
        shell: bash
        run: echo "version=$(cat .node-version)" >> "${GITHUB_OUTPUT}"

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          build-args: NODE_VERSION=${{ steps.node.outputs.version }}
          cache-from: type=gha,scope=image-linux-amd64
          cache-to: type=gha,mode=max,scope=image-linux-amd64

      - name: Smoke test image
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          container="next-whois-smoke-${GITHUB_RUN_ID}"
          cleanup() {
            docker rm -f "${container}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach --name "${container}" "${IMAGE}"

          for attempt in {1..30}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' "${container}")"
            case "${status}" in
              healthy)
                exit 0
                ;;
              unhealthy)
                docker logs "${container}"
                docker inspect --format '{{json .State.Health.Log}}' "${container}"
                exit 1
                ;;
            esac
            sleep 2
          done

          docker logs "${container}"
          docker inspect --format '{{json .State.Health.Log}}' "${container}"
          exit 1

  build-arm64:
    name: Build image (linux/arm64)
    needs: ci
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    if: ${{  github.ref_name == github.event.repository.default_branch }}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare image name
        id: image
        shell: bash
        run: echo "name=${REGISTRY}/${IMAGE_NAME,,}" >> "${GITHUB_OUTPUT}"

      - name: Read Node.js version
        id: node
        shell: bash
        run: echo "version=$(cat .node-version)" >> "${GITHUB_OUTPUT}"

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          build-args: NODE_VERSION=${{ steps.node.outputs.version }}
          cache-from: type=gha,scope=image-linux-arm64
          cache-to: type=gha,mode=max,scope=image-linux-arm64

      - name: Smoke test image
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          container="next-whois-smoke-${GITHUB_RUN_ID}"
          cleanup() {
            docker rm -f "${container}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach --name "${container}" "${IMAGE}"

          for attempt in {1..30}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' "${container}")"
            case "${status}" in
              healthy)
                exit 0
                ;;
              unhealthy)
                docker logs "${container}"
                docker inspect --format '{{json .State.Health.Log}}' "${container}"
                exit 1
                ;;
            esac
            sleep 2
          done

          docker logs "${container}"
          docker inspect --format '{{json .State.Health.Log}}' "${container}"
          exit 1

  publish:
    name: Publish multi-platform manifest
    needs:
      - build-amd64
      - build-arm64
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always() &&
      needs.build-amd64.result == 'success' &&
      (
      needs.build-arm64.result == 'success' ||
      needs.build-arm64.result == 'skipped'
      )
    steps:
      - name: Prepare image tags
        id: image
        shell: bash
        run: |
          image="${REGISTRY}/${IMAGE_NAME,,}"
          ref="$(printf '%s' "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g; s/^[.-]+//; s/[.-]+$//')"
          tag="${ref:0:128}"

          if [ -z "${tag}" ]; then
            tag="sha-${GITHUB_SHA::12}"
          fi

          echo "name=${image}" >> "${GITHUB_OUTPUT}"

          {
            echo "tags<<EOF"
            echo "${image}:${tag}"
            if [ "${GITHUB_REF_NAME}" = "${DEFAULT_BRANCH}" ]; then
              echo "${image}:sha-${GITHUB_SHA::12}"
              echo "${image}:latest"
            else
              echo "${image}:pre-${GITHUB_SHA::12}"
            fi

            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Create and push manifest
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          TAGS: ${{ steps.image.outputs.tags }}
          AMD64_DIGEST: ${{ needs.build-amd64.outputs.digest }}
          ARM64_DIGEST: ${{ needs.build-arm64.outputs.digest }}
        run: |
          set -euo pipefail

          tag_args=()

          while IFS= read -r tag; do
            if [ -n "${tag}" ]; then
              tag_args+=("-t" "${tag}")
            fi
          done <<< "${TAGS}"

          images=("${IMAGE}@${AMD64_DIGEST}")

          if [ -n "${ARM64_DIGEST:-}" ]; then
            echo "Publishing multi-arch image"
            images+=("${IMAGE}@${ARM64_DIGEST}")
          else
            echo "Publishing amd64-only image"
          fi

          docker buildx imagetools create \
            "${tag_args[@]}" \
            "${images[@]}"
  zeabur-deploy:
    name: Update Zeabur image tag
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
    steps:
      - name: Validate Zeabur config
        env:
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
          ZEABUR_SERVICE_ID: ${{ vars.ZEABUR_SERVICE_ID }}
          ZEABUR_ENVIRONMENT_ID: ${{ vars.ZEABUR_ENVIRONMENT_ID }}
        shell: bash
        run: |
          test -n "${ZEABUR_TOKEN}"
          test -n "${ZEABUR_SERVICE_ID}"
          test -n "${ZEABUR_ENVIRONMENT_ID}"

      - name: Update Zeabur image tag
        env:
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
          ZEABUR_SERVICE_ID: ${{ vars.ZEABUR_SERVICE_ID }}
          ZEABUR_ENVIRONMENT_ID: ${{ vars.ZEABUR_ENVIRONMENT_ID }}
        shell: bash
        run: |
          zeabur_image_tag="sha-${GITHUB_SHA::12}"
          query='mutation UpdateServiceImageTag($serviceId: ObjectID!, $environmentId: ObjectID!, $tag: String!) { updateServiceImageTag(serviceID: $serviceId, environmentID: $environmentId, tag: $tag) }'

          response="$(
            jq -n \
              --arg query "${query}" \
              --arg serviceId "${ZEABUR_SERVICE_ID}" \
              --arg environmentId "${ZEABUR_ENVIRONMENT_ID}" \
              --arg tag "${zeabur_image_tag}" \
              '{query: $query, variables: {serviceId: $serviceId, environmentId: $environmentId, tag: $tag}}' |
            curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${ZEABUR_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @- \
            https://api.zeabur.com/graphql
          )"

          if ! echo "${response}" | jq -e ".errors == null" > /dev/null; then
            echo "${response}" | jq .
            exit 1
          fi

          echo "Updated Zeabur image tag to ${zeabur_image_tag}"
